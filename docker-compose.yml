version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shiftsense
      POSTGRES_PASSWORD: shiftsense
      POSTGRES_DB: shiftsense
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://shiftsense:shiftsense@db:5432/shiftsense
      JWT_SECRET: change-me
    ports:
      - "8000:8000"
    depends_on:
      - db
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  db_data:
